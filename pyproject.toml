[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakshya"
version = "0.1.0"
description = "Lakshya portfolio analysis"
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = [
    "python"
]
testpaths = [
    "python/tests"
]
norecursedirs = [
    "python/tests/parked"
]
